name: Build Windows Release（电脑版）

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # 创建 Release 与上传附件所需

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: pip install fastapi uvicorn pyinstaller
      - name: 打包 exe
        shell: pwsh
        env:
          WS: ${{ github.workspace }}
        run: |
          pyinstaller --noconfirm --onefile --name "PushIt" --paths . --distpath . --workpath build --specpath build `
            --hidden-import uvicorn.logging --hidden-import uvicorn.loops.auto `
            --hidden-import uvicorn.protocols.http.auto --hidden-import uvicorn.protocols.websockets.auto `
            --hidden-import uvicorn.lifespan.on `
            --add-data "$env:WS\frontend;frontend" --add-data "$env:WS\backend;backend" `
            --add-data "$env:WS\scripts;scripts" --add-data "$env:WS\data\strategy_lib.json;data" `
            "$env:WS\scripts\desktop_launcher.py"
      - name: 组装安装包
        shell: pwsh
        run: |
          # zip 文件名用 ASCII（CI 的 pwsh 会把 workflow 里的中文文件名损坏成点）
          New-Item -ItemType Directory -Force -Path dist-release | Out-Null
          Copy-Item PushIt.exe dist-release\
          Get-ChildItem release -Filter *.txt | Copy-Item -Destination dist-release\
          Compress-Archive -Path dist-release\* -DestinationPath PushIt-win64.zip
          New-Item -ItemType Directory -Force -Path dist-mobile | Out-Null
          Copy-Item frontend dist-mobile\frontend -Recurse
          Get-ChildItem release -Filter *.txt | Copy-Item -Destination dist-mobile\
          Compress-Archive -Path dist-mobile\* -DestinationPath PushIt-mobile.zip
      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          # files 必须多行（空格分隔会被当成单个 glob 而匹配失败）
          files: |
            PushIt-win64.zip
            PushIt-mobile.zip
          generate_release_notes: true
